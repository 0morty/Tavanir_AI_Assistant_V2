services:
  tavanir_qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: tavanir_qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-7333}:6333"
      - "${QDRANT_GRPC_PORT:-7334}:6334"
    volumes:
      - ${QDRANT_STORAGE_PATH:-./data/qdrant_storage}:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    networks:
      - tavanir_network
    depends_on:
      - tavanir_vector
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  tavanir_postgres:
    image: postgres:16-alpine
    container_name: tavanir_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-7432}:5432"
    volumes:
      - ${POSTGRES_STORAGE_PATH:-./data/postgres_storage}:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tavanir_db}
    networks:
      - tavanir_network
    depends_on:
      - tavanir_vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d ${POSTGRES_DB:-tavanir_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tavanir_openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.92.2
    container_name: tavanir_openobserve
    restart: unless-stopped
    ports:
      - "${OPENOBSERVE_PORT:-5080}:5080"
    volumes:
      - ${OPENOBSERVE_STORAGE_PATH:-./data/openobserve_storage}:/data
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_USER_EMAIL:-admin@tavanir.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_USER_PASSWORD:-TavanirAdmin2026!}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: 30
    networks:
      - tavanir_network

  tavanir_vector:
    image: timberio/vector:0.43.0-alpine
    container_name: tavanir_vector
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./configs/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${VECTOR_DATA_PATH:-./data/vector_data}:/var/lib/vector
    environment:
      OPENOBSERVE_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_USER_EMAIL:-admin@tavanir.local}
      OPENOBSERVE_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_USER_PASSWORD:-TavanirAdmin2026!}
    networks:
      - tavanir_network
    depends_on:
      - tavanir_openobserve

networks:
  tavanir_network:
    name: tavanir_network
    driver: bridge


